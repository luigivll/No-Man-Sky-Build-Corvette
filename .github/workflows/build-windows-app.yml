name: Build the Windows app

# The shipyard is a static export plus a small Electron shell, so the Windows
# build is entirely reproducible from the repo: no game files, no secrets, no
# network at run time. This workflow compiles it on a Windows runner and attaches
# the installer to a release, which is the download the double-click path needs.
#
# Trigger: push a tag like  app-v1.0.0  (or run it by hand from the Actions tab).
# Output:  a release named after the tag, with
#            NMS-Corvette-Shipyard-Setup-<version>.exe   (installer)
#            NMS-Corvette-Shipyard-<version>-win.zip     (portable, no install)

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check and lint
        run: |
          npm run typecheck
          npm run lint

      - name: Verify the ships
        run: |
          npx tsx --tsconfig tsconfig.json scripts/tools/audit.ts
          npm run verify

      - name: Build the static site
        shell: bash
        run: |
          set -o pipefail
          npm run build:static 2>&1 | tee build.log

      # A failing Windows build cannot be debugged from the sandbox (the log
      # endpoint is unreachable there), so this job used to PARK the tail of its
      # log in the repository: it committed ci-build-error.log and pushed it to
      # the branch under test. That worked exactly once — it is how the
      # 'spawn EINVAL' crash was found — and then left a stale copy of a crash
      # from a build that had already been fixed sitting in the tree, which is
      # precisely the kind of debris somebody later reads as a live failure.
      #
      # The log now goes where a failing job's output belongs: the run summary,
      # plus an artifact you can download. A CI job has no business writing
      # commits to the branch it is testing.
      - name: Publish the build log
        if: failure()
        shell: bash
        run: |
          if [ ! -f build.log ]; then
            echo "::error::the job failed before the static build, so there is no build.log"
            exit 0
          fi
          {
            echo "### build:static — ultimas 80 lineas"
            echo
            echo '```'
            tail -n 80 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::build:static failed — full log in the summary and in the windows-build-log artifact"

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: build.log
          if-no-files-found: ignore

      # The artifact names come from package.json, while the release name comes
      # from the tag, so a tag without a version bump ships an installer labelled
      # with the PREVIOUS version. Taking the version from the tag keeps the two
      # in step without anybody having to remember.
      - name: Sync the version with the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#app-v}"
          echo "tag $GITHUB_REF_NAME -> version $VERSION"
          node -e "
            const fs = require('fs');
            const v = process.argv[1];
            for (const f of ['package.json', 'package-lock.json']) {
              const j = JSON.parse(fs.readFileSync(f, 'utf8'));
              j.version = v;
              if (j.packages && j.packages['']) j.packages[''].version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + '\n');
            }
          " "$VERSION"

      - name: Package the Windows app
        run: npx electron-builder --win --x64 --publish never

      - name: List what came out
        run: Get-ChildItem release | Format-Table Name, Length
        shell: pwsh

      - name: Upload the build as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nms-corvette-shipyard-windows
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
          if-no-files-found: warn

      - name: Attach the build to a release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "NMS Corvette Shipyard $tag" \
              --notes "Windows build of the shipyard: install, launch, everything works offline."
          gh release upload "$tag" release/*.exe release/*.zip --clobber
          # A second copy under a name with no version in it, so the README can
          # link to /releases/latest/download/<stable name> and stay correct
          # forever instead of being edited on every single release.
          cp "$(ls release/*.exe | head -1)" release/NMS.Corvette.Shipyard.Setup.exe
          cp "$(ls release/*.zip | head -1)" release/NMS.Corvette.Shipyard-win.zip
          gh release upload "$tag" \
            release/NMS.Corvette.Shipyard.Setup.exe \
            release/NMS.Corvette.Shipyard-win.zip --clobber
          gh release view "$tag" --json assets --jq '.assets[] | "\(.name)\t\(.size)"'
